<main class="admin_contenido contenido_cliente">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="admin_titulo mb-1">Clientes</h1>
            <p class="text-secondary mb-0">
                Registra y administra la información de los clientes.
            </p>
        </div>

        <button class="btn admin_boton" onclick="nuevoCliente()">
            + Agregar cliente
        </button>
    </div>

    <!-- Tabla de clientes -->
    <div class="admin_panel">

        <input
            id="buscar_cliente"
            class="form-control mb-3"
            placeholder="Buscar por nombre, teléfono o correo..."
        >

        <div class="table-responsive">
            <table class="table admin_tabla table-hover">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Vehículo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="lista_clientes"></tbody>
            </table>
        </div>
    </div>

    <!-- Formulario para agregar o editar -->
    <div class="admin_panel mt-3" id="panel_cliente" style="display: none;">

        <h2 class="h5" id="titulo_cliente">Agregar cliente</h2>

        <form id="form_cliente" class="row g-3">

            <input type="hidden" id="cliente_indice" value="-1">

            <div class="col-md-6">
                <label class="form-label">Nombre completo</label>
                <input id="cliente_nombre" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Teléfono</label>
                <input id="cliente_telefono" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Correo electrónico</label>
                <input
                    id="cliente_correo"
                    type="email"
                    class="form-control"
                    required
                >
            </div>

            <div class="col-md-6">
                <label class="form-label">Vehículo</label>
                <input
                    id="cliente_vehiculo"
                    class="form-control"
                    placeholder="Marca y modelo"
                    required
                >
            </div>

            <div class="col-12">
                <button class="btn admin_boton" type="submit">
                    Guardar
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cancelarCliente()"
                >
                    Cancelar
                </button>
            </div>

        </form>
    </div>

</main>

<script>

// Datos de los clientes
let clientes = JSON.parse(
    localStorage.getItem("tm_clientes") || "null"
);

// Clientes de ejemplo
if (clientes === null) {
    clientes = [
        {
            nombre: "Juan Pérez",
            telefono: "477 123 4567",
            correo: "juan@correo.com",
            vehiculo: "Chevrolet Camaro"
        },
        {
            nombre: "María López",
            telefono: "477 234 5678",
            correo: "maria@correo.com",
            vehiculo: "Chevrolet Silverado"
        },
        {
            nombre: "Carlos Ramírez",
            telefono: "477 345 6789",
            correo: "carlos@correo.com",
            vehiculo: "Kia Rio"
        }
    ];

    guardarClientes();
}

// Guardar en localStorage
function guardarClientes() {
    localStorage.setItem(
        "tm_clientes",
        JSON.stringify(clientes)
    );
}

// Mostrar y buscar clientes
function mostrarClientes() {
    let tabla = document.getElementById("lista_clientes");

    let buscar = document
        .getElementById("buscar_cliente")
        .value.toLowerCase();

    tabla.innerHTML = "";

    for (let i = 0; i < clientes.length; i++) {

        let c = clientes[i];

        let informacion = (
            c.nombre +
            c.telefono +
            c.correo +
            c.vehiculo
        ).toLowerCase();

        if (informacion.includes(buscar)) {

            tabla.innerHTML += `
                <tr>
                    <td>${c.nombre}</td>
                    <td>${c.telefono}</td>
                    <td>${c.correo}</td>
                    <td>${c.vehiculo}</td>
                    <td>
                        <button
                            class="btn btn-sm btn-outline-secondary me-1"
                            onclick="editarCliente(${i})"
                        >
                            Editar
                        </button>

                        <button
                            class="btn btn-sm admin_boton"
                            onclick="eliminarCliente(${i})"
                        >
                            Eliminar
                        </button>
                    </td>
                </tr>
            `;
        }
    }
}

// Abrir formulario para un nuevo cliente
function nuevoCliente() {

    document.getElementById("form_cliente").reset();

    document.getElementById("cliente_indice").value = -1;

    document.getElementById("titulo_cliente").textContent =
        "Agregar cliente";

    document.getElementById("panel_cliente").style.display =
        "block";
}

// Cerrar formulario
function cancelarCliente() {
    document.getElementById("panel_cliente").style.display =
        "none";
}

// Editar cliente
function editarCliente(i) {

    let c = clientes[i];

    document.getElementById("cliente_indice").value = i;
    document.getElementById("cliente_nombre").value = c.nombre;
    document.getElementById("cliente_telefono").value = c.telefono;
    document.getElementById("cliente_correo").value = c.correo;
    document.getElementById("cliente_vehiculo").value = c.vehiculo;

    document.getElementById("titulo_cliente").textContent =
        "Editar cliente";

    document.getElementById("panel_cliente").style.display =
        "block";
}

// Eliminar cliente
function eliminarCliente(i) {

    if (confirm("¿Eliminar este cliente?")) {

        clientes.splice(i, 1);

        guardarClientes();
        mostrarClientes();
    }
}

// Guardar nuevo cliente o cambios
document
    .getElementById("form_cliente")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        let i = Number(
            document.getElementById("cliente_indice").value
        );

        let c = {
            nombre: document.getElementById("cliente_nombre").value,
            telefono: document.getElementById("cliente_telefono").value,
            correo: document.getElementById("cliente_correo").value,
            vehiculo: document.getElementById("cliente_vehiculo").value
        };

        if (i < 0) {
            clientes.push(c);
        } else {
            clientes[i] = c;
        }

        guardarClientes();
        mostrarClientes();
        cancelarCliente();
    });

// Buscar mientras se escribe
document
    .getElementById("buscar_cliente")
    .addEventListener("input", mostrarClientes);

// Mostrar clientes al iniciar
mostrarClientes();

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
