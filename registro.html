<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | Tuerca Maestra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/miEstilo.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="encabezado_taller text-center py-3">
        <a href="index.html" class="logo_taller">
            <i class="bi bi-gear-wide-connected"></i> Tuerca Maestra
        </a>
    </header>

    <nav class="navbar navbar-expand-md nav_lila">
        <div class="container">
            <button class="navbar-toggler ms-auto" type="button"
                data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false"
                aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-center" id="menuPrincipal">
                <ul class="navbar-nav gap-md-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="inicioSesion.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link active" href="registro.html">Registrarse</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center">
        <section class="container py-5">
            <div class="row formulario_acceso g-0 mx-auto">

                <!-- Imagen -->
                <div class=" imagen col-12 col-md-5 imagen_acceso">
                    <img src="images/llaves.jpg" alt="Herramientas de mecánico">
                </div>

                <!-- Formulario de registro -->
                <div class="col-12 col-md-7 formulario_coral">
                    <h1 class="h3 text-center mb-4">Regístrate</h1>

                    <form id="formularioRegistro">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre"
                                name="nombre" autocomplete="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="correoRegistro" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoRegistro"
                                name="correo" autocomplete="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefono" class="form-label">Número de teléfono</label>
                            <input type="tel" class="form-control" id="telefono"
                                name="telefono" autocomplete="tel"
                                inputmode="tel" required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasenaRegistro" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasenaRegistro"
                                name="contrasena" autocomplete="new-password"
                                minlength="8" required>
                            <div class="form-text">
                                Utiliza al menos 8 caracteres.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmarContrasena" class="form-label">
                                Confirmar contraseña
                            </label>
                            <input type="password" class="form-control" id="confirmarContrasena"
                                name="confirmarContrasena" autocomplete="new-password"
                                minlength="8" required>
                        </div>

                        <p id="mensajeRegistro" class="small" role="status" aria-live="polite"></p>

                        <button type="submit" class="btn btn-light rounded-pill d-block mx-auto px-4">
                            <i class="bi bi-person-plus"></i> Crear cuenta
                        </button>
                    </form>

                    <p class="text-center small mt-4 mb-0">
                        ¿Ya tienes una cuenta?
                        <a href="inicioSesion.html" class="enlace_formulario">
                            Inicia sesión
                        </a>
                    </p>
                </div>

            </div>
        </section>
    </main>

    <footer class="pie_taller text-center py-3">
        <p class="small mb-0">&copy; 2026 Justin Hernandez. Todos los derechos reservados.</p>
    </footer>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    const formularioRegistro = document.getElementById("formularioRegistro");
    formularioRegistro.addEventListener("submit", function(event) {
        event.preventDefault();
        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correoRegistro").value.trim();
        const telefono = document.getElementById("telefono").value.trim();
        const contrasena = document.getElementById("contrasenaRegistro").value;
        const confirmarContrasena = document.getElementById("confirmarContrasena").value;
        const mensaje = document.getElementById("mensajeRegistro");
        // Verificar que se hayan capturado los datos
        if (!nombre || !correo || !telefono || !contrasena) {
            mensaje.textContent = "Completa todos los campos.";
            mensaje.style.color = "#c2441f";
            return;
        }
        // Indicar que el registro fue completado
        mensaje.textContent = "Registro completado. Elige tu perfil.";
        mensaje.style.color = "#14122A";
        // Indicar a inicioSesion.html que debe mostrar la selección de perfil
        sessionStorage.setItem("mostrarPerfiles", "true");
        // Redireccionar a la pantalla de inicio de sesión
        window.location.href = "inicioSesion.html";
    });
</script>


</body>
</html>
