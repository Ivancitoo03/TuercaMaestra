
<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal | Tuerca Maestra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/miEstilo.css"></head>
<body class="panel_cliente admin_pagina">
    <!-- Encabezado principal, siguiendo el diseño de la vista de cliente -->
    <div class="encabezado_fijo_cliente">
        <header class="encabezado_taller text-center py-3">
            <a href="index.html" class="logo_taller">
                <i class="bi bi-gear-wide-connected"></i> Tuerca Maestra
            </a>
        </header>
        <div class="menu_superior_cliente">
            <button class="btn boton_menu_cliente" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuAdministrador"
                    aria-controls="menuAdministrador" aria-label="Abrir menú del administrador">
                <i class="bi bi-list"></i>
            </button>
            <span>Menú de administrador</span>
        </div>
    </div>

    <!-- Menú desplegable de navegación -->
    <div class="offcanvas offcanvas-start menu_cliente" tabindex="-1"
         id="menuAdministrador" aria-labelledby="tituloMenuAdministrador">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="tituloMenuAdministrador">Tuerca Maestra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body">
            <div class="perfil_cliente text-center">
            <img src="images/perfil.jpg" alt="Foto del cliente"  class="foto_perfil">
                <p class="mb-0 mt-2">Administrador</p>
                <small>Panel de gestión</small>
            </div>
            <nav class="nav flex-column menu_opciones">
                <a href="admin.html"><i class="bi bi-house"></i> Inicio</a>
                <a href="adminPersonal.html" class="active"><i class="bi bi-people"></i> Personal</a>
                <a href="adminClientes.html"><i class="bi bi-person-lines-fill"></i> Clientes</a>
                <a href="adminServicios.html"><i class="bi bi-wrench-adjustable"></i> Servicios</a>
                <a href="inicioSesion.html"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
            </nav>
        </div>
    </div>

    
<!-- Contenido de la sección Personal -->
<main class="admin_contenido contenido_cliente">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="admin_titulo mb-1">Personal</h1>
            <p class="text-secondary mb-0">
                Gestiona el personal del taller.
            </p>
        </div>

        <button class="btn admin_boton" onclick="nuevoPersonal()">
            + Agregar personal
        </button>
    </div>

    <!-- Buscador -->
    <div class="admin_panel mb-3">
        <input
            id="buscar_personal"
            class="form-control"
            placeholder="Buscar por nombre o puesto..."
        >
    </div>

    <!-- Tarjetas del personal -->
    <div id="tarjetas_personal" class="row g-3"></div>

    <!-- Formulario para agregar o editar personal -->
    <div class="admin_panel mt-3" id="panel_formulario" style="display: none;">

        <h2 class="h5" id="titulo_form">Agregar personal</h2>

        <form id="form_personal" class="row g-3">

            <input type="hidden" id="personal_indice" value="-1">

            <div class="col-md-6">
                <label for="personal_nombre" class="form-label">
                    Nombre completo
                </label>
                <input id="personal_nombre" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="personal_puesto" class="form-label">
                    Puesto
                </label>
                <input id="personal_puesto" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="personal_telefono" class="form-label">
                    Teléfono
                </label>
                <input id="personal_telefono" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label for="personal_correo" class="form-label">
                    Correo electrónico
                </label>
                <input
                    id="personal_correo"
                    type="email"
                    class="form-control"
                    required
                >
            </div>

            <!-- Seleccionar fotografía -->
            <div class="col-md-6">
                <label for="personal_foto" class="form-label">
                    Fotografía del empleado
                </label>

                <input
                    type="file"
                    id="personal_foto"
                    class="form-control"
                    accept="image/*"
                    onchange="mostrarFotoPersonal()"
                >
            </div>

            <!-- Vista previa de la fotografía -->
            <div class="col-md-6 text-center">
                <img
                    id="vista_foto_personal"
                    src=""
                    alt="Vista previa del empleado"
                    class="foto-empleado"
                    style="display: none;"
                >
            </div>

            <!-- Botones del formulario -->
            <div class="col-12">
                <button type="submit" class="btn admin_boton">
                    Guardar
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="cancelarPersonal()"
                >
                    Cancelar
                </button>
            </div>

        </form>
    </div>

</main>

<script>
    // Cargar el personal guardado en el navegador
    let personal = JSON.parse(
        localStorage.getItem("tm_personal") || "null"
    );

    // Crear registros de ejemplo la primera vez
    if (personal === null) {
        personal = [
            {
                nombre: "Juan Pérez",
                puesto: "Mecánico",
                telefono: "477 123 4567",
                correo: "juan@taller.com",
                foto: ""
            },
            {
                nombre: "Ana Torres",
                puesto: "Recepcionista",
                telefono: "477 345 6789",
                correo: "ana@taller.com",
                foto: ""
            },
            {
                nombre: "Luis García",
                puesto: "Ayudante",
                telefono: "477 456 7890",
                correo: "luis@taller.com",
                foto: ""
            }
        ];

        guardarPersonal();
    }

    // Guardar los datos del personal
    function guardarPersonal() {
        localStorage.setItem(
            "tm_personal",
            JSON.stringify(personal)
        );
    }

    // Mostrar la fotografía seleccionada antes de guardar
    function mostrarFotoPersonal() {
        let archivo = document.getElementById("personal_foto").files[0];
        let vista = document.getElementById("vista_foto_personal");

        if (archivo) {
            // Comprobar que el archivo sea una imagen
            if (!archivo.type.startsWith("image/")) {
                alert("Selecciona un archivo de imagen válido.");
                document.getElementById("personal_foto").value = "";
                return;
            }

            // Limitar el tamaño para evitar llenar el almacenamiento
            if (archivo.size > 1500000) {
                alert("La fotografía debe pesar menos de 1.5 MB.");
                document.getElementById("personal_foto").value = "";
                return;
            }

            let lector = new FileReader();

            lector.onload = function (e) {
                vista.src = e.target.result;
                vista.style.display = "inline-block";
            };

            lector.readAsDataURL(archivo);
        }
    }

    // Mostrar las tarjetas del personal
    function mostrarPersonal() {
        let contenedor = document.getElementById("tarjetas_personal");

        let buscar = document.getElementById("buscar_personal")
            .value.toLowerCase();

        contenedor.innerHTML = "";

        for (let i = 0; i < personal.length; i++) {
            let p = personal[i];

            let informacion = (p.nombre + p.puesto).toLowerCase();

            if (informacion.includes(buscar)) {
                let foto = p.foto
                    ? `<img src="${p.foto}" alt="Foto de ${p.nombre}" class="foto-personal">`
                    : `<i class="bi bi-person-circle fs-1"></i>`;

                contenedor.innerHTML += `
                    <div class="col-sm-6 col-xl-3">
                        <div class="admin_tarjeta">

                            <div class="text-center">
                                ${foto}

                                <h3 class="h6 mt-2 mb-1">
                                    ${p.nombre}
                                </h3>

                                <p class="text-secondary mb-2">
                                    ${p.puesto}
                                </p>
                            </div>

                            <p class="small mb-1">
                                <i class="bi bi-telephone me-2"></i>
                                ${p.telefono}
                            </p>

                            <p class="small">
                                <i class="bi bi-envelope me-2"></i>
                                ${p.correo}
                            </p>

                            <button
                                class="btn btn-sm btn-outline-secondary"
                                onclick="editarPersonal(${i})"
                            >
                                Editar
                            </button>

                            <button
                                class="btn btn-sm admin_boton"
                                onclick="eliminarPersonal(${i})"
                            >
                                Eliminar
                            </button>

                        </div>
                    </div>
                `;
            }
        }
    }

    // Abrir el formulario para registrar personal
    function nuevoPersonal() {
        document.getElementById("form_personal").reset();

        document.getElementById("personal_indice").value = -1;

        document.getElementById("titulo_form").textContent =
            "Agregar personal";

        document.getElementById("vista_foto_personal").src = "";
        document.getElementById("vista_foto_personal").style.display = "none";

        document.getElementById("panel_formulario").style.display = "block";
    }

    // Cerrar el formulario
    function cancelarPersonal() {
        document.getElementById("panel_formulario").style.display = "none";
    }

    // Cargar los datos de un empleado para editarlo
    function editarPersonal(i) {
        let p = personal[i];

        document.getElementById("personal_indice").value = i;
        document.getElementById("personal_nombre").value = p.nombre;
        document.getElementById("personal_puesto").value = p.puesto;
        document.getElementById("personal_telefono").value = p.telefono;
        document.getElementById("personal_correo").value = p.correo;

        document.getElementById("personal_foto").value = "";

        let vista = document.getElementById("vista_foto_personal");

        if (p.foto) {
            vista.src = p.foto;
            vista.style.display = "inline-block";
        } else {
            vista.src = "";
            vista.style.display = "none";
        }

        document.getElementById("titulo_form").textContent =
            "Editar personal";

        document.getElementById("panel_formulario").style.display = "block";
    }

    // Eliminar un empleado
    function eliminarPersonal(i) {
        if (confirm("¿Eliminar este trabajador?")) {
            personal.splice(i, 1);

            guardarPersonal();
            mostrarPersonal();
        }
    }

    // Guardar un empleado nuevo o actualizar sus datos
    document.getElementById("form_personal").addEventListener(
        "submit",
        function (e) {
            e.preventDefault();

            let i = Number(
                document.getElementById("personal_indice").value
            );

            let archivo = document.getElementById("personal_foto").files[0];

            let persona = {
                nombre: document.getElementById("personal_nombre").value,
                puesto: document.getElementById("personal_puesto").value,
                telefono: document.getElementById("personal_telefono").value,
                correo: document.getElementById("personal_correo").value,
                foto: i >= 0 ? personal[i].foto || "" : ""
            };

            // Guardar la foto si se seleccionó una nueva
            if (archivo) {
                let lector = new FileReader();

                lector.onload = function (e) {
                    persona.foto = e.target.result;
                    guardarPersona();
                };

                lector.readAsDataURL(archivo);
            } else {
                guardarPersona();
            }

            // Guardar los datos y actualizar las tarjetas
            function guardarPersona() {
                if (i < 0) {
                    personal.push(persona);
                } else {
                    personal[i] = persona;
                }

                guardarPersonal();
                mostrarPersonal();
                cancelarPersonal();
            }
        }
    );

    // Buscar personal por nombre o puesto
    document.getElementById("buscar_personal").addEventListener(
        "input",
        mostrarPersonal
    );

    // Mostrar el personal al cargar la página
    mostrarPersonal();
</script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
