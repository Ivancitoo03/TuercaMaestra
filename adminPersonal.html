<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Personal | Tuerca Maestra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/miEstilo.css"></head>
<body class="panel_cliente admin_pagina">
    <!-- Encabezado principal, siguiendo el diseño de la vista de cliente -->
    <div class="encabezado_fijo_cliente">
        <header class="encabezado_taller text-center py-3">
            <a href="index.html" class="logo_taller">
                <i class="bi bi-gear-wide-connected"></i> Tuerca Maestra
            </a>
        </header>
        <div class="menu_superior_cliente">
            <button class="btn boton_menu_cliente" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuAdministrador"
                    aria-controls="menuAdministrador" aria-label="Abrir menú del administrador">
                <i class="bi bi-list"></i>
            </button>
            <span>Menú de administrador</span>
        </div>
    </div>

    <!-- Menú desplegable de navegación -->
    <div class="offcanvas offcanvas-start menu_cliente" tabindex="-1"
         id="menuAdministrador" aria-labelledby="tituloMenuAdministrador">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="tituloMenuAdministrador">Tuerca Maestra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body">
            <div class="perfil_cliente text-center">
                <i class="bi bi-person-circle" style="font-size: 4rem;"></i>
                <p class="mb-0 mt-2">Administrador</p>
                <small>Panel de gestión</small>
            </div>
            <nav class="nav flex-column menu_opciones">
                <a href="admin.html"><i class="bi bi-house"></i> Inicio</a>
                <a href="adminPersonal.html" class="active"><i class="bi bi-people"></i> Personal</a>
                <a href="adminClientes.html"><i class="bi bi-person-lines-fill"></i> Clientes</a>
                <a href="adminServicios.html"><i class="bi bi-wrench-adjustable"></i> Servicios</a>
                <a href="inicioSesion.html"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
            </nav>
        </div>
    </div>

    <!-- Contenido de la sección seleccionada -->
    <main class="admin_contenido contenido_cliente">
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><div><h1 class="admin_titulo mb-1">Personal</h1><p class="text-secondary mb-0">Gestiona el personal del taller.</p></div><button class="btn admin_boton" onclick="nuevoPersonal()">+ Agregar personal</button></div><div class="admin_panel mb-3"><input id="buscar_personal" class="form-control" placeholder="Buscar por nombre o puesto..."></div><div id="tarjetas_personal" class="row g-3"></div>
<div class="admin_panel mt-3" id="panel_formulario" style="display:none"><h2 class="h5" id="titulo_form">Agregar personal</h2><form id="form_personal" class="row g-3"><input type="hidden" id="personal_indice" value="-1"><div class="col-md-4"><label class="form-label">Nombre</label><input id="personal_nombre" class="form-control" required></div><div class="col-md-4"><label class="form-label">Puesto</label><input id="personal_puesto" class="form-control" required></div><div class="col-md-4"><label class="form-label">Teléfono</label><input id="personal_telefono" class="form-control" required></div><div class="col-md-6"><label class="form-label">Correo</label><input id="personal_correo" type="email" class="form-control" required></div><div class="col-md-6 d-flex align-items-end gap-2"><button class="btn admin_boton">Guardar</button><button type="button" class="btn btn-secondary" onclick="cancelarPersonal()">Cancelar</button></div></form></div></main>
<script>let personal=JSON.parse(localStorage.getItem("tm_personal")||"null");if(personal===null){personal=[{nombre:"Juan Pérez",puesto:"Mecánico",telefono:"477 123 4567",correo:"juan@taller.com"},{nombre:"Ana Torres",puesto:"Recepcionista",telefono:"477 345 6789",correo:"ana@taller.com"},{nombre:"Luis García",puesto:"Ayudante",telefono:"477 456 7890",correo:"luis@taller.com"}];guardarPersonal();}
function guardarPersonal(){localStorage.setItem("tm_personal",JSON.stringify(personal));}
function mostrarPersonal(){let cont=document.getElementById("tarjetas_personal");let buscar=document.getElementById("buscar_personal").value.toLowerCase();cont.innerHTML="";for(let i=0;i<personal.length;i++){if((personal[i].nombre+personal[i].puesto).toLowerCase().includes(buscar)){cont.innerHTML+=`<div class="col-sm-6 col-xl-3"><div class="admin_tarjeta"><div class="text-center"><i class="bi bi-person-circle fs-1"></i><h3 class="h6 mt-2 mb-1">${personal[i].nombre}</h3><p class="text-secondary mb-2">${personal[i].puesto}</p></div><p class="small mb-1"><i class="bi bi-telephone me-2"></i>${personal[i].telefono}</p><p class="small">${personal[i].correo}</p><button class="btn btn-sm btn-outline-secondary" onclick="editarPersonal(${i})">Editar</button> <button class="btn btn-sm admin_boton" onclick="eliminarPersonal(${i})">Eliminar</button></div></div>`;}}}
function nuevoPersonal(){document.getElementById("form_personal").reset();document.getElementById("personal_indice").value=-1;document.getElementById("titulo_form").textContent="Agregar personal";document.getElementById("panel_formulario").style.display="block";}
function cancelarPersonal(){document.getElementById("panel_formulario").style.display="none";}
function editarPersonal(i){document.getElementById("personal_indice").value=i;document.getElementById("personal_nombre").value=personal[i].nombre;document.getElementById("personal_puesto").value=personal[i].puesto;document.getElementById("personal_telefono").value=personal[i].telefono;document.getElementById("personal_correo").value=personal[i].correo;document.getElementById("titulo_form").textContent="Editar personal";document.getElementById("panel_formulario").style.display="block";}
function eliminarPersonal(i){if(confirm("¿Eliminar este trabajador?")){personal.splice(i,1);guardarPersonal();mostrarPersonal();}}
document.getElementById("form_personal").addEventListener("submit",function(e){e.preventDefault();let i=Number(document.getElementById("personal_indice").value);let persona={nombre:document.getElementById("personal_nombre").value,puesto:document.getElementById("personal_puesto").value,telefono:document.getElementById("personal_telefono").value,correo:document.getElementById("personal_correo").value};if(i<0){personal.push(persona);}else{personal[i]=persona;}guardarPersonal();mostrarPersonal();cancelarPersonal();});document.getElementById("buscar_personal").addEventListener("input",mostrarPersonal);mostrarPersonal();</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
