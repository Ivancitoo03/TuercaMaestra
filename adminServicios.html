<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Servicios | Tuerca Maestra</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"><link rel="stylesheet" href="css/miEstilo.css"></head>
<body class="panel_cliente admin_pagina">
    <!-- Encabezado principal, siguiendo el diseño de la vista de cliente -->
    <div class="encabezado_fijo_cliente">
        <header class="encabezado_taller text-center py-3">
            <a href="index.html" class="logo_taller">
                <i class="bi bi-gear-wide-connected"></i> Tuerca Maestra
            </a>
        </header>
        <div class="menu_superior_cliente">
            <button class="btn boton_menu_cliente" type="button"
                    data-bs-toggle="offcanvas" data-bs-target="#menuAdministrador"
                    aria-controls="menuAdministrador" aria-label="Abrir menú del administrador">
                <i class="bi bi-list"></i>
            </button>
            <span>Menú de administrador</span>
        </div>
    </div>

    <!-- Menú desplegable de navegación -->
    <div class="offcanvas offcanvas-start menu_cliente" tabindex="-1"
         id="menuAdministrador" aria-labelledby="tituloMenuAdministrador">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="tituloMenuAdministrador">Tuerca Maestra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar menú"></button>
        </div>
        <div class="offcanvas-body">
            <div class="perfil_cliente text-center">
            <img src="images/perfil.jpg" alt="Foto del cliente"  class="foto_perfil">
                <p class="mb-0 mt-2">Administrador</p>
                <small>Panel de gestión</small>
            </div>
            <nav class="nav flex-column menu_opciones">
                <a href="admin.html"><i class="bi bi-house"></i> Inicio</a>
                <a href="adminPersonal.html"><i class="bi bi-people"></i> Personal</a>
                <a href="adminClientes.html"><i class="bi bi-person-lines-fill"></i> Clientes</a>
                <a href="adminServicios.html" class="active"><i class="bi bi-wrench-adjustable"></i> Servicios</a>
                <a href="inicioSesion.html"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
            </nav>
        </div>
    </div>

    <!-- Contenido de la sección seleccionada -->
    <main class="admin_contenido contenido_cliente">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4"><div>
    <h1 class="admin_titulo mb-1">Servicios</h1><p class="text-secondary mb-0">Administra los servicios disponibles del taller.</p></div><button class="btn admin_boton" onclick="nuevoServicio()">+ Agregar servicio</button></div><div class="admin_panel mb-3"><input id="buscar_servicio" class="form-control" placeholder="Buscar servicio..."></div><div id="tarjetas_servicios" class="row g-3"></div><div class="admin_panel mt-3" id="panel_servicio" style="display:none"><h2 class="h5" id="titulo_servicio">Agregar servicio</h2><form id="form_servicio" class="row g-3"><input type="hidden" id="servicio_indice" value="-1"><div class="col-md-4"><label class="form-label">Nombre del servicio</label><input id="servicio_nombre" class="form-control" required></div><div class="col-md-5"><label class="form-label">Descripción</label><input id="servicio_descripcion" class="form-control" required></div><div class="col-md-3"><label class="form-label">Precio (MXN)</label><input id="servicio_precio" type="number" min="0" step="0.01" class="form-control" required></div><div class="col-12"><button class="btn admin_boton">Guardar</button> <button type="button" class="btn btn-secondary" onclick="cancelarServicio()">Cancelar</button></div></form></div></main>
        <script>let servicios=JSON.parse(localStorage.getItem("tm_servicios")||"null");
        if(servicios===null){
            servicios=[{nombre:"Afinación",descripcion:"Cambio de bujías, filtros y revisión general.",precio:800},
            {nombre:"Cambio de aceite",descripcion:"Cambio de aceite y filtro.",precio:450},
            {nombre:"Frenos",descripcion:"Revisión y cambio de balatas.",precio:700},
            {nombre:"Llantas",descripcion:"Venta e instalación de llantas.",precio:600}];
            guardarServicios();
        }
            function guardarServicios(){
                localStorage.setItem("tm_servicios",JSON.stringify(servicios));
            }
            function mostrarServicios(){
                let cont=document.getElementById("tarjetas_servicios");
                let buscar=document.getElementById("buscar_servicio").value.toLowerCase();
                cont.innerHTML="";
                for(let i=0;i<servicios.length;i++){
                    let s=servicios[i];
                    if((s.nombre+s.descripcion).toLowerCase().includes(buscar))
                    {
                        cont.innerHTML+=`<div class="col-sm-6 col-xl-3"><div class="admin_tarjeta"><div class="text-center mb-3"><i class="bi bi-wrench-adjustable-circle fs-2"></i><h3 class="h6 mt-2">${s.nombre}</h3></div><p class="small text-secondary" style="min-height:42px">${s.descripcion}</p><div class="fw-bold mb-3">$${Number(s.precio).toFixed(2)} MXN</div><button class="btn btn-sm btn-outline-secondary" onclick="editarServicio(${i})">Editar</button> <button class="btn btn-sm admin_boton" onclick="eliminarServicio(${i})">Eliminar</button></div></div>`;}}}
            function nuevoServicio(){
                document.getElementById("form_servicio").reset();
                document.getElementById("servicio_indice").value=-1;
                document.getElementById("titulo_servicio").textContent="Agregar servicio";
                document.getElementById("panel_servicio").style.display="block";}
            function cancelarServicio(){document.getElementById("panel_servicio").style.display="none";
            }
            function editarServicio(i){
                let s=servicios[i];
                document.getElementById("servicio_indice").value=i;
                document.getElementById("servicio_nombre").value=s.nombre;
                document.getElementById("servicio_descripcion").value=s.descripcion;
                document.getElementById("servicio_precio").value=s.precio;
                document.getElementById("titulo_servicio").textContent="Editar servicio";
                document.getElementById("panel_servicio").style.display="block";}
            function eliminarServicio(i){
                if(confirm("¿Eliminar este servicio?"))
                {servicios.splice(i,1);
                    guardarServicios();
                    mostrarServicios();
                }
            }
                document.getElementById("form_servicio").addEventListener("submit",function(e)
                {e.preventDefault();
                let i=Number(document.getElementById("servicio_indice").value);
                let s={nombre:document.getElementById("servicio_nombre").value,descripcion:document.getElementById("servicio_descripcion").value,precio:document.getElementById("servicio_precio").value};
                if(i<0){servicios.push(s);

                }
                else{servicios[i]=s;

                }guardarServicios();
                mostrarServicios();
                cancelarServicio();
                }
                )
                ;document.getElementById("buscar_servicio").addEventListener("input",mostrarServicios);
                mostrarServicios();
                </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
